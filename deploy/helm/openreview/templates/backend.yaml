apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openreview.name" . }}-backend
  labels: {{- include "openreview.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  serviceName: {{ include "openreview.name" . }}-backend
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend }
  template:
    metadata:
      labels: {{- include "openreview.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      {{- if .Values.config.grammars.enabled }}
      initContainers:
        - name: grammars
          image: {{ required "config.grammars.image is required when grammars are enabled" .Values.config.grammars.image | quote }}
          command: ["sh", "-c", "cp -r /grammars/. /bundle/"]
          volumeMounts: [{ name: grammars, mountPath: /bundle }]
      {{- end }}
      containers:
        - name: convex-backend
          image: "{{ .Values.backend.image.repository }}@{{ .Values.backend.image.digest }}"
          ports:
            - { name: functions, containerPort: 3210 }
            - { name: site, containerPort: 3211 }
          env:
            - { name: CONVEX_CLOUD_ORIGIN, value: {{ .Values.backend.cloudOrigin | quote }} }
            - { name: CONVEX_SITE_ORIGIN, value: {{ .Values.backend.siteOrigin | quote }} }
            - { name: INSTANCE_NAME, value: {{ .Values.backend.instanceName | quote }} }
            - name: INSTANCE_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "openreview.secretName" . }}, key: CONVEX_INSTANCE_SECRET } }
            - { name: NODE_ACTION_USER_TIMEOUT_SECS, value: "600" }
            - { name: DISABLE_METRICS_ENDPOINT, value: "true" }
            - { name: REDACT_LOGS_TO_CLIENT, value: "true" }
          readinessProbe:
            httpGet: { path: /version, port: functions }
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /convex/data }
            {{- if .Values.config.grammars.enabled }}
            - { name: grammars, mountPath: /grammars, readOnly: true }
            {{- end }}
      {{- if .Values.config.grammars.enabled }}
      volumes:
        - { name: grammars, emptyDir: {} }
      {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.backend.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.backend.persistence.size | quote }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openreview.name" . }}-backend
  labels: {{- include "openreview.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend }
  ports:
    - { name: functions, port: 3210, targetPort: functions }
    - { name: site, port: 3211, targetPort: site }
