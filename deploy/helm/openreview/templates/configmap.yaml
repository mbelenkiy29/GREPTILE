apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openreview.name" . }}-config
  labels: {{- include "openreview.labels" . | nindent 4 }}
data:
  APP_URL: {{ .Values.config.appUrl | quote }}
  NEXT_PUBLIC_CONVEX_URL: {{ .Values.backend.cloudOrigin | quote }}
  NEXT_PUBLIC_CONVEX_SITE_URL: {{ .Values.backend.siteOrigin | quote }}
  {{- with .Values.config.scmAllowedHosts }}
  SCM_ALLOWED_HOSTS: {{ . | quote }}
  {{- end }}
  OPENREVIEW_OFFLINE: {{ ternary "true" "false" .Values.config.offline | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  {{- with .Values.config.llmBaseUrl }}
  LLM_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.web.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
