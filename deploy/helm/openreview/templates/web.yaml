apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openreview.name" . }}-web
  labels: {{- include "openreview.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: {{- include "openreview.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001 }
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ default .Chart.AppVersion .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.web.port }} }]
          envFrom:
            - configMapRef: { name: {{ include "openreview.name" . }}-config }
          # Only the keys the web app needs; the Convex instance secret stays with the backend.
          env:
            {{- range .Values.secrets.webKeys }}
            - name: {{ . }}
              valueFrom: { secretKeyRef: { name: {{ include "openreview.secretName" $ }}, key: {{ . }}, optional: true } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openreview.name" . }}-web
  labels: {{- include "openreview.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
