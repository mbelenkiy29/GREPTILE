services:
  backend:
    image: ${CONVEX_BACKEND_IMAGE:-ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4}
    stop_grace_period: 20s
    stop_signal: SIGINT
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_PUBLIC_BACKEND_URL:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_PUBLIC_SITE_URL:-http://127.0.0.1:3211}
      NODE_ACTION_USER_TIMEOUT_SECS: 600
      DISABLE_METRICS_ENDPOINT: "true"
      REDACT_LOGS_TO_CLIENT: "true"
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-openreview}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?Set a strong CONVEX_INSTANCE_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 10s
      timeout: 5s
      start_period: 30s
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.local
    environment:
      NEXT_PUBLIC_CONVEX_URL: http://backend:3210
    depends_on:
      backend:
        condition: service_healthy
volumes:
  convex-data:
