name: openreview

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openreview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openreview}
      POSTGRES_DB: ${POSTGRES_DB:-openreview}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runner
      secrets:
        - extra_ca
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openreview}:${POSTGRES_PASSWORD:-openreview}@postgres:5432/${POSTGRES_DB:-openreview}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    build:
      context: .
      target: worker
      secrets:
        - extra_ca
    # Needs the GitHub App and LLM variables from .env; see .env.example.
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openreview}:${POSTGRES_PASSWORD:-openreview}@postgres:5432/${POSTGRES_DB:-openreview}
      REDIS_URL: redis://redis:6379
      REPO_CACHE_DIR: /data/repos
    volumes:
      - repocache:/data/repos
    depends_on:
      app:
        condition: service_healthy

secrets:
  # Set EXTRA_CA_CERT to a PEM bundle only if builds run behind a TLS-intercepting proxy.
  extra_ca:
    file: ${EXTRA_CA_CERT:-./docker/no-extra-ca.pem}

volumes:
  repocache:
  pgdata:
  redisdata:
