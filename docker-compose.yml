name: openreview

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openreview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openreview}
      POSTGRES_DB: ${POSTGRES_DB:-openreview}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web app: dashboard, API, webhooks. Applies database migrations on start (RUN_MIGRATIONS).
  app:
    build:
      context: .
      target: runner
      secrets:
        - extra_ca
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Containers always run as production (`.env.example` says development for `pnpm dev`).
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-openreview}:${POSTGRES_PASSWORD:-openreview}@postgres:5432/${POSTGRES_DB:-openreview}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    build:
      context: .
      target: worker
      secrets:
        - extra_ca
    # Needs APP_SECRET, the GitHub App, LLM, and embedding variables from .env; see .env.example and
    # docs/configuration.md. Until the GitHub App is configured (/setup/github-app) it exits and restarts.
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Containers always run as production (`.env.example` says development for `pnpm dev`).
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-openreview}:${POSTGRES_PASSWORD:-openreview}@postgres:5432/${POSTGRES_DB:-openreview}
      REDIS_URL: redis://redis:6379
      REPO_CACHE_DIR: /data/repos
    volumes:
      - repocache:/data/repos
    # Time for in-flight reviews and indexing to finish after SIGTERM before Docker kills the worker.
    stop_grace_period: 5m
    # Healthy while this container's worker refreshes its Redis heartbeat (every 15 s).
    healthcheck:
      test: ["CMD", "node_modules/.bin/tsx", "worker/healthcheck.ts"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

secrets:
  # Set EXTRA_CA_CERT to a PEM bundle only if builds run behind a TLS-intercepting proxy.
  extra_ca:
    file: ${EXTRA_CA_CERT:-./docker/no-extra-ca.pem}

volumes:
  repocache:
  pgdata:
  redisdata:
