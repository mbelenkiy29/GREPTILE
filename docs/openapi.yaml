openapi: 3.1.0
info:
  title: OpenReview public API
  version: "1.0.0"
  description: |
    Every endpoint takes a workspace API key: `Authorization: Bearer or_...`. Create keys in
    Settings → API Keys. A key belongs to one workspace and acts as its owner, so the owner's
    workspace role and team membership still limit every call.

    Scopes: `read` (query, search, repositories, reviews), `write` (also request reviews, send
    feedback, enable repositories) and `admin` (also administrator endpoints such as Perforce
    indexing). `admin` includes `write`, and `write` includes `read`. Keys created before scopes
    existed keep full access.

    Errors use `{ "error": string, "issues"?: [{ "path", "message" }] }`:
    - 401: missing, invalid or revoked key.
    - 403: missing scope or role.
    - 404: the resource is outside the key's workspace or access.
    - 400: validation failure.
    - 409: conflicting state.
    - 429: rate limited.
servers:
  - url: "{appUrl}"
    variables:
      appUrl:
        default: https://openreview.example.com
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Workspace API key beginning with `or_`.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
    Id:
      type: string
      pattern: "^[A-Za-z0-9]{20,64}$"
    Finding:
      type: object
      description: >-
        A verified finding at the reviewed revision. `priority`, `tags` and `outsideDiff` are additive
        fields; clients that ignore unknown fields are unaffected and `severity` is unchanged.
      required: [_id, title, description, severity, priority, tags, category, confidence, filePath, startLine, endLine, evidence]
      properties:
        _id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        description: { type: string }
        severity: { type: string, enum: [critical, high, medium, low] }
        priority: { type: string, enum: [P0, P1, P2, P3], description: "critical = P0, high = P1, medium = P2, low = P3." }
        tags: { type: array, items: { type: string, enum: [security] }, description: "security for findings in the security category." }
        category: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        filePath: { type: string }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        outsideDiff: { type: boolean, description: "Anchored on a line the change did not modify; listed in the summary, not inline." }
        evidence:
          type: array
          items:
            type: object
            required: [filePath, startLine, quote]
            properties:
              filePath: { type: string }
              startLine: { type: integer, minimum: 1 }
              quote: { type: string }
        impact: { type: string }
        suggestedFix: { type: string }
        currentStatus: { type: string }
    ReviewDetail:
      type: object
      required: [review, findings]
      properties:
        review:
          type: object
          description: Review lifecycle record, including `reviewScore` and `verdict` (ready, fixes, changes or incomplete) when recorded.
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
    Source:
      type: object
      required: [repository, path, startLine, endLine, quote, revision]
      properties:
        repository: { type: string, example: acme/shop }
        path: { type: string, example: src/cart.ts }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        quote: { type: string, description: "Exact lines from the indexed revision." }
        revision: { type: string, description: "Indexed commit the quote was read from." }
        url: { type: string, format: uri, description: "Provider link pinned to the revision." }
    QueryResult:
      type: object
      required: [threadId, messageId, status, answer, sources, limits]
      properties:
        threadId: { $ref: "#/components/schemas/Id" }
        messageId: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [pending, running, completed, failed] }
        answer:
          type: [string, "null"]
          description: GitHub Markdown; every claim carries an [n] marker matching sources[n-1].
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        limits: { type: array, items: { type: string } }
        error: { type: string }
    SearchResult:
      type: object
      properties:
        repositoryId: { $ref: "#/components/schemas/Id" }
        repository: { type: string }
        path: { type: string }
        startLine: { type: integer }
        endLine: { type: integer }
        snippet: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string, example: semantic + full-text match }
        revision: { type: string }
    RepositoryStatus:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        fullName: { type: string }
        defaultBranch: { type: string }
        enabled: { type: boolean }
        indexStatus: { type: string, example: ready }
        indexedSha: { type: [string, "null"] }
        pendingIndexSha: { type: [string, "null"] }
        indexedAt: { type: [number, "null"], description: "Milliseconds since the epoch." }
        knowledgeStatus: { type: [string, "null"] }
        error: { type: [string, "null"] }
  responses:
    Unauthorized: { description: "Missing, invalid or revoked API key.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: "The key lacks the required scope or the owner lacks the role.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: "Not in this workspace or not accessible to the key owner.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Invalid: { description: "Validation failed.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
paths:
  /api/query:
    post:
      summary: Ask a question about repositories (scope read)
      description: |
        OpenReview investigates the indexed repositories with read-only code tools and answers
        only when every citation exactly matches lines it read at the indexed revision.
        - **JSON (default):** waits up to about 280 seconds. Returns 200 when the answer completes,
          422 when no validated answer could be produced, and 202 while it is still running; poll
          `GET /api/query/{messageId}` in that case.
        - **`stream: true`:** returns Server-Sent Events, in this order:
          - `thread`: `{ threadId, messageId }`
          - `progress`: zero or more `{ kind, text }`
          - then exactly one of:
            - `answer`: a QueryResult
            - `error`: `{ error, limits }`
            - `timeout`
        Questions share the codebase-chat rate limits (6 per key owner and 30 per workspace per
        minute) and the inference budget. Pass `threadId` to ask a follow-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, repositoryIds]
              properties:
                question: { type: string, minLength: 2, maxLength: 4000 }
                repositoryIds: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/Id" } }
                threadId: { $ref: "#/components/schemas/Id" }
                stream: { type: boolean, default: false }
      responses:
        "200": { description: "Completed answer.", content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } }, text/event-stream: { schema: { type: string } } } }
        "202": { description: "Still running; poll GET /api/query/{messageId}.", content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A repository is not indexed yet, or the thread is still answering.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "No answer with matching citations was produced.", content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } } }
        "429": { description: "Rate limited.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/query/{messageId}:
    get:
      summary: Fetch a query result (scope read)
      parameters:
        - { name: messageId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { description: "Current state of the answer.", content: { application/json: { schema: { $ref: "#/components/schemas/QueryResult" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/search:
    post:
      summary: Hybrid code search (scope read)
      description: |
        Combines full-text search with semantic search when embeddings are configured. Returns
        ranked snippets from the stored index at each repository's indexed revision. Defaults to
        the key's enabled, indexed repositories (at most 10). Limited to 60 searches per workspace
        per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 200 }
                repositoryIds: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/Id" } }
                limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Ranked results, best first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/SearchResult" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A repository is not indexed yet.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Rate limited.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/workspace:
    get:
      summary: The API key's workspace and onboarding links (scope read)
      description: |
        Returns the workspace the key belongs to, the key owner's other workspaces (each one needs its
        own key), and dashboard links used by `openreview onboard`, including the provider install
        link. The install link opens in a browser; this endpoint changes nothing.
      responses:
        "200":
          description: Workspace and links.
          content:
            application/json:
              schema:
                type: object
                required: [workspace, workspaces, installUrl, dashboardUrl, keysUrl, rulesUrl]
                properties:
                  workspace: { type: object, properties: { id: { type: string }, name: { type: string }, role: { type: string } } }
                  workspaces: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, role: { type: string }, current: { type: boolean } } } }
                  installUrl: { type: string, format: uri }
                  dashboardUrl: { type: string, format: uri }
                  keysUrl: { type: string, format: uri }
                  rulesUrl: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/rules/import:
    post:
      summary: Import candidate rules as suggestions that an admin approves (scope admin)
      description: |
        Used by `openreview onboard` to import AI rule files (CLAUDE.md, AGENTS.md, Cursor, Windsurf,
        Copilot and Gemini rules). Each candidate passes the rule safety checks; accepted ones are
        stored as suggestions on the Custom rules page and never become rules without approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rules]
              properties:
                repositoryId: { $ref: "#/components/schemas/Id" }
                rules:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [title, instructions, source]
                    properties:
                      title: { type: string, minLength: 3, maxLength: 120 }
                      instructions: { type: string, minLength: 20, maxLength: 2000 }
                      globs: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
                      source: { type: object, required: [path, line], properties: { path: { type: string }, line: { type: integer, minimum: 1 } } }
      responses:
        "201":
          description: Suggestions stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggested: { type: integer }
                  rejected: { type: array, items: { type: object, properties: { title: { type: string }, reason: { type: string } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/reviews/status:
    get:
      summary: Latest review of a pull request (scope read)
      parameters:
        - { name: repositoryId, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: prNumber, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: "Pull request, latest readable review (status, verdict, coversCurrentHead) and the count of open findings.", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Repository not accessible to this key." }
  /api/findings/unresolved:
    get:
      summary: Open findings on the key owner's own open pull requests (scope read)
      parameters:
        - { name: repositoryId, in: query, required: false, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { description: "Findings with repository, pull request, file, line, priority and suggested fix.", content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/rules/suggestions:
    post:
      summary: Suggest a custom rule for an admin to approve (scope write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, instructions]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                instructions: { type: string, minLength: 20, maxLength: 2000 }
                repositoryId: { $ref: "#/components/schemas/Id" }
      responses:
        "201": { description: "Suggestion stored.", content: { application/json: { schema: { type: object, properties: { suggestionId: { type: string }, status: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "The rule failed the safety checks (for example it would suppress findings)." }
  /api/analytics:
    get:
      summary: Analytics report for the key's workspace as JSON (scope read)
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date } }
        - { name: until, in: query, required: true, schema: { type: string, format: date } }
        - { name: team, in: query, required: false, schema: { $ref: "#/components/schemas/Id" } }
        - { name: repository, in: query, required: false, schema: { $ref: "#/components/schemas/Id" } }
        - { name: author, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Totals, severity, addressed rate, usefulness, cost and a daily series.", content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/repositories:
    get:
      summary: List repositories visible to the key owner (scope read)
      responses:
        "200": { description: "Repositories.", content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Enable an installed repository and index it (scope write)
      description: |
        For a disabled repository, this enables it and queues indexing. For an enabled one, it
        queues a re-index; nothing new is queued while an index is already queued or running.
        Returns the repository's status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repositoryId]
              properties:
                repositoryId: { $ref: "#/components/schemas/Id" }
      responses:
        "202": { description: "Indexing requested.", content: { application/json: { schema: { $ref: "#/components/schemas/RepositoryStatus" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/repositories/{id}:
    get:
      summary: Repository index status (scope read)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { description: "Status.", content: { application/json: { schema: { $ref: "#/components/schemas/RepositoryStatus" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/reviews:
    get:
      summary: List reviews (scope read)
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "A page of reviews." }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Request a review of a pull request revision (scope write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryId, prNumber]
              properties:
                repositoryId: { $ref: "#/components/schemas/Id" }
                prNumber: { type: integer, minimum: 1 }
                headSha: { type: string, pattern: "^[a-f0-9]{40}$", description: "Defaults to the pull request head last observed by OpenReview." }
      responses:
        "202": { description: "Review queued.", content: { application/json: { schema: { type: object, properties: { reviewId: { $ref: "#/components/schemas/Id" } } } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/reviews/{id}:
    get:
      summary: Review detail (scope read)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: historyCursor, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Review, findings and history.", content: { application/json: { schema: { $ref: "#/components/schemas/ReviewDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/findings/{id}/feedback:
    post:
      summary: Record feedback on a finding (scope write)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, enum: [useful, not_useful, resolved, wont_fix, false_positive] }
                comment: { type: string, maxLength: 5000, default: "" }
      responses:
        "200": { description: "Recorded." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/context:
    get:
      summary: Repository context for coding agents (scope read)
      parameters:
        - { name: repositoryId, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: path, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: "Symbols, relationships, knowledge, rules and optionally one file." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/p4/index:
    get:
      summary: Perforce indexing status (scope read; administrator role)
      parameters:
        - { name: repositoryId, in: query, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200": { description: "Status." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Upload Perforce submitted-revision metadata (scope admin)
      responses:
        "202": { description: "Accepted." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/p4/reviews:
    post:
      summary: Request a review of a Perforce shelf (scope admin)
      responses:
        "202": { description: "Accepted." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
