name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should OpenReview do? Mention related feature IDs from docs/OPENREVIEW_SPEC.md if you know them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: self-hosting
    attributes:
      label: Constraints
      options:
        - label: This must keep working on a single self-hosted server with no hosted services besides the model endpoint and git host.
